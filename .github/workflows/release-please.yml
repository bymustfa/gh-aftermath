name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open a release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # npm publish is disabled. Nothing in this workflow publishes a package or
  # creates a GitHub Release (see skip-github-release in the config).
