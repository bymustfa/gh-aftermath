name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # This repository is private. Do not publish results to the public Scorecard API.
          publish_results: false
      # Code scanning is not enabled, so the SARIF stays as a workflow artifact
      # instead of being uploaded to the Security tab.
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
