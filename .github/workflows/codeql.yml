name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # This private repository does not have GitHub code scanning enabled, so
      # uploading SARIF to the code scanning API fails the job. The analysis
      # still runs. The SARIF file is kept as a workflow artifact. Turn upload
      # back on after code scanning is enabled in the repository settings.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
